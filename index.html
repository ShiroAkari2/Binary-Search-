<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Binary Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f6;--panel:#fbfbfe;--ink:#1b1f3b;--mute:#5d6385;--line:#d5d9e8;--lamp:#e8a62b;--good:#1f8a5b;--bad:#c2413b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10132a;--panel:#1a1e3d;--ink:#eceefc;--mute:#9aa1c8;--line:#2d3363;--lamp:#f2b84b;--good:#4fd09a;--bad:#ff7d75}}
:root[data-theme="dark"]{--bg:#10132a;--panel:#1a1e3d;--ink:#eceefc;--mute:#9aa1c8;--line:#2d3363;--lamp:#f2b84b;--good:#4fd09a;--bad:#ff7d75}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1,h2{font-family:"Shippori Mincho",Georgia,serif;margin:0}
h1{font-size:clamp(1.9rem,7vw,2.6rem);font-weight:800}
h2{font-size:1.5rem}
.sub{color:var(--mute);margin:6px 0 24px}
.grid{display:grid;gap:10px}
.mode{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font:inherit;cursor:pointer}
.mode:hover:not(:disabled){border-color:var(--lamp)}
.mode:disabled{opacity:.6;cursor:default}
.mode b{font-size:1.05rem;display:block}
.mode small{color:var(--mute)}
.best{font-size:.85rem;color:var(--mute);text-align:right;white-space:nowrap}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.primary{background:var(--lamp);color:#1b1f3b;border:0;border-radius:8px;padding:11px 20px;font:inherit;font-weight:700;cursor:pointer}
.cyan{background:#22d3ee;color:#0b2530}
input[type=text],input[type=number]{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.stats{display:flex;gap:16px;flex-wrap:wrap;color:var(--mute);font-size:.95rem}
.stats b{color:var(--ink)}
.bar{height:14px;border-radius:7px;background:var(--line);overflow:hidden;margin:10px 0 6px;position:relative}
.lit{position:absolute;top:0;bottom:0;background:var(--lamp);box-shadow:0 0 14px var(--lamp);transition:left .35s,width .35s;min-width:3px}
.msg{min-height:1.5em;margin:8px 0 0;font-weight:500}
.msg.err{color:var(--bad)}
.hist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px;max-height:260px;overflow:auto}
.hist li{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;background:var(--bg)}
.tag{font-weight:700}
.t-low,.t-high{color:var(--mute)}
.t-cl{color:var(--lamp)}
.end{text-align:center;padding:28px 16px}
.big{font-family:"Shippori Mincho",serif;font-size:3rem;font-weight:800;margin:8px 0}
.win{color:var(--good)}.lose{color:var(--bad)}
.stars{font-size:1.6rem;color:var(--lamp);letter-spacing:.1em}
label.chk{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:.95rem}
summary{cursor:pointer;font-weight:700}
.cust{display:grid;gap:8px}
@media (prefers-reduced-motion:reduce){.lit{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
var MODES=[
 {id:"se",name:"Super Easy",max:10,limit:5,close:2},
 {id:"e",name:"Easy",max:100,limit:10,close:10},
 {id:"m",name:"Medium",max:1000,limit:15,close:100},
 {id:"h",name:"Hard",max:10000,limit:20,close:1000},
 {id:"x",name:"Extreme",max:100000,limit:25,close:10000},
 {id:"i",name:"Impossible",max:1000000,limit:30,close:100000}
];
var $=function(i){return document.getElementById(i)},app=$("app"),S=null,showRange=false,strict=false;
function fmt(n){return n.toLocaleString("en-US")}
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function rm(k){try{localStorage.removeItem(k)}catch(e){}}
function opt(m){return Math.ceil(Math.log2(m.max-1))}
function lim(m){return strict?opt(m):m.limit}
function today(){var d=new Date(),p=function(n){return String(n).padStart(2,"0")};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function rnd(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}h^=h>>>13;h=Math.imul(h,1274126177);h^=h>>>16;return(h>>>0)/4294967296}
function el(h){app.innerHTML=h}
function lobby(){
 var b=ld("sa-best",{}),sa=ld("sa-save",null),day=today(),dd=ld("sa-daily",{}),dm=MODES[3],
 h='<h1>Binary Search</h1><p class="sub">By ShiroAkari</p>';
 if(sa)h+='<button class="mode" id="resume" style="margin-bottom:10px"><span><b>Resume game</b><small>'+sa.m.name+', '+sa.g.length+'/'+sa.m.limit+' attempts used</small></span></button>';
 h+='<button class="mode" id="daily"'+(dd[day]?' disabled':'')+'><span><b>Daily challenge</b><small>'+dm.name+', same number for everyone today</small></span><span class="best">'+(dd[day]?(dd[day].win?dd[day].n+'/'+dm.limit:'Lost'):'Not played')+'</span></button>';
 h+='<label class="chk" style="margin:16px 0 10px"><input type="checkbox" id="st"'+(strict?' checked':'')+'> Strict mode (attempts = optimal worst case)</label><div class="grid">';
 MODES.forEach(function(m){var k=m.id+(strict?"s":"");
  h+='<button class="mode" data-id="'+m.id+'"><span><b>'+m.name+'</b><small>(Max num '+fmt(m.max-1)+', Max attempt '+lim(m)+')</small></span><span class="best">'+(b[k]?'Best '+b[k]:'No record')+'</span></button>'});
 h+='</div><div class="card cust"><b>Custom mode</b><div class="row"><input type="number" id="cmax" placeholder="Max number (10-1000000)"><input type="number" id="clim" placeholder="Max attempts"></div><div class="row"><button class="primary cyan" id="cgo">Start</button><span class="sub" style="margin:0" id="cerr"></span></div></div>';
 h+='<details class="card"><summary>How to play</summary><p class="sub" style="margin:8px 0 0">The computer picks a secret number. Each guess gets one hint: <b>too low</b> or <b>too high</b> when you are far away, <b>close below</b> or <b>close above</b> when you are within the close distance. Guess the number before attempts run out. Aim for the middle of what is still possible, and use close hints to shrink the range faster. Stars: 3 if you match binary search, 2 if within 30% of it, 1 otherwise.</p></details>';
 el(h);
 app.querySelectorAll("[data-id]").forEach(function(x){x.onclick=function(){start(MODES.filter(function(m){return m.id===x.dataset.id})[0])}});
 $("st").onchange=function(e){strict=e.target.checked;lobby()};
 $("daily").onclick=function(){start(dm,day)};
 if(sa)$("resume").onclick=function(){S=sa;play()};
 $("cgo").onclick=function(){
  var mx=parseInt($("cmax").value,10),lm=parseInt($("clim").value,10);
  if(!(mx>=10&&mx<=1000000)||!(lm>=1&&lm<=100)){$("cerr").textContent="Max number 10-1,000,000 and attempts 1-100.";return}
  start({id:"c",name:"Custom",max:mx,limit:lm,close:Math.max(1,Math.round(mx/10))},null,true);
 };
}
function start(m,daily,custom){
 var L=daily||custom?m.limit:lim(m);
 m=Object.assign({},m,{limit:L});
 var r=daily?rnd(daily+m.id):Math.random();
 S={m:m,key:m.id+(strict&&!daily&&!custom?"s":""),daily:daily||null,secret:1+Math.floor(r*(m.max-1)),g:[],lo:1,hi:m.max-1,msg:"",err:false,helped:false};
 play();
}
function hint(g){
 var n=S.secret,cl=Math.abs(g-n)<=S.m.close;
 if(g===n)return "correct";
 if(g<n)return cl?"close below":"too low";
 return cl?"close above":"too high";
}
function cls(h){return h.indexOf("close")===0?"t-cl":"t-"+(h==="too low"?"low":"high")}
function list(){
 var h='<ul class="hist">';
 for(var i=S.g.length-1;i>=0;i--){var e=S.g[i];h+='<li><span>#'+(i+1)+' · '+fmt(e.v)+'</span><span class="tag '+(e.h==="correct"?"win":cls(e.h))+'">'+e.h+'</span></li>'}
 return h+'</ul>';
}
function play(){
 var m=S.m,left=m.limit-S.g.length,pct=function(v){return (v-1)/(m.max-2)*100};
 var h='<div class="top"><h2>'+(S.daily?'Daily '+S.daily:m.name)+'</h2><button class="ghost" id="back">Lobby</button></div>';
 h+='<p class="sub" style="margin-bottom:0">Guess 1-'+fmt(m.max-1)+'. Close means within '+fmt(m.close)+'.</p>';
 h+='<div class="card"><div class="stats"><span>Attempts left <b>'+left+'/'+m.limit+'</b></span>';
 if(showRange)h+='<span>Possible range <b>'+fmt(S.lo)+'-'+fmt(S.hi)+'</b></span>';
 h+='</div>';
 if(showRange){var l=pct(S.lo),w=Math.max(pct(S.hi)-l,0);h+='<div class="bar" aria-hidden="true"><div class="lit" style="left:'+l+'%;width:'+w+'%"></div></div>'}
 h+='<div class="row" style="margin-top:12px"><input type="text" id="gin" inputmode="numeric" autocomplete="off" placeholder="Your guess" aria-label="Your guess"><button class="primary" id="go">Guess</button></div>';
 h+='<p class="msg'+(S.err?' err':'')+'" role="status">'+S.msg+'</p>';
 h+='<label class="chk"><input type="checkbox" id="rg"'+(showRange?' checked':'')+'> Show possible range (helper)</label></div>';
 h+='<div class="card"><b>History</b>'+(S.g.length?list():'<p class="sub" style="margin:6px 0 0">No guesses yet. Type a number and press Guess.</p>')+'</div>';
 el(h);
 var inp=$("gin");inp.focus();
 inp.onkeydown=function(e){if(e.key==="Enter")submit()};
 $("go").onclick=submit;
 $("back").onclick=lobby;
 $("rg").onchange=function(e){showRange=e.target.checked;play()};
}
function submit(){
 var raw=$("gin").value.trim(),m=S.m;
 S.err=true;
 if(!/^\d+$/.test(raw)){S.msg="Enter a whole number, no letters or decimals. No attempt used.";return play()}
 var v=parseInt(raw,10);
 if(v<1||v>m.max-1){S.msg="Number must be between 1 and "+fmt(m.max-1)+". No attempt used.";return play()}
 if(S.g.some(function(x){return x.v===v})){S.msg=fmt(v)+" was already guessed. Try another number.";return play()}
 var h=hint(v);S.g.push({v:v,h:h});S.err=false;
 if(showRange)S.helped=true;
 if(h==="correct")return end(true);
 if(h==="too low"||h==="close below"){S.lo=Math.max(S.lo,v+1);if(h==="close below")S.hi=Math.min(S.hi,v+m.close)}
 else{S.hi=Math.min(S.hi,v-1);if(h==="close above")S.lo=Math.max(S.lo,v-m.close)}
 if(S.g.length>=m.limit)return end(false);
 S.msg=fmt(v)+": "+h+".";
 sv("sa-save",S);
 play();
}
function ideal(m,s){var lo=1,hi=m.max-1,a=[];for(;;){var x=Math.floor((lo+hi)/2);a.push(x);if(x===s)break;if(x<s)lo=x+1;else hi=x-1}return a}
function end(win){
 var m=S.m,n=S.g.length,o=opt(m),st=n<=o?3:n<=Math.ceil(o*1.3)?2:1,rec=false,h;
 rm("sa-save");
 if(win&&!S.daily&&S.key!=="c"){var b=ld("sa-best",{});if(!b[S.key]||n<b[S.key]){b[S.key]=n;sv("sa-best",b);rec=true}}
 if(S.daily){var dd=ld("sa-daily",{});dd[S.daily]={win:win,n:n};sv("sa-daily",dd)}
 var tx="ShiroAkari "+(S.daily?"Daily "+S.daily:m.name)+" "+(win?n:"X")+"/"+m.limit+(win?" "+"★".repeat(st):"")+(S.helped?" (helper on)":"");
 var id=ideal(m,S.secret);
 if(win)h='<div class="card end"><div class="win">Correct</div><div class="big">'+fmt(S.secret)+'</div><div class="stars" aria-label="'+st+' stars">'+"★".repeat(st)+"☆".repeat(3-st)+'</div><p>Found in '+n+' of '+m.limit+' attempts. Efficiency '+Math.min(100,Math.round(o/n*100))+'%.'+(rec?' New best for this mode.':'')+'</p>';
 else h='<div class="card end"><div class="lose">Out of attempts</div><div class="big">'+fmt(S.secret)+'</div><p>That was the secret number.</p>';
 h+='<p class="sub">Plain binary search needs '+id.length+' guesses here: '+id.join(", ")+'.</p>';
 h+='<div class="row" style="justify-content:center"><input type="text" id="shtxt" readonly value="'+tx+'" aria-label="Share text"><button class="ghost" id="sh">Copy</button></div>';
 h+='<div class="row" style="justify-content:center;margin-top:12px">'+(S.daily?'':'<button class="primary" id="again">Play again</button>')+'<button class="ghost" id="lob">Back to lobby</button></div></div>';
 h+='<div class="card"><b>History</b>'+list()+'</div>';
 el(h);
 var mm=m,dl=S.daily,cs=S.key==="c";
 if($("again"))$("again").onclick=function(){start(mm,null,cs)};
 $("lob").onclick=lobby;
 $("sh").onclick=function(){
  var t=$("sh"),f=function(){$("shtxt").select();t.textContent="Select and copy"};
  try{navigator.clipboard.writeText(tx).then(function(){t.textContent="Copied"},f)}catch(e){f()}
 };
}
lobby();
</script>
</body>
</html>
