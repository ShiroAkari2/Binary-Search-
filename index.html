<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Binary Search ShiroAkari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f6;--panel:#fbfbfe;--ink:#1b1f3b;--mute:#5d6385;--line:#d5d9e8;--lamp:#e8a62b;--lamp-soft:#f9e3b0;--good:#1f8a5b;--bad:#c2413b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10132a;--panel:#1a1e3d;--ink:#eceefc;--mute:#9aa1c8;--line:#2d3363;--lamp:#f2b84b;--lamp-soft:#4a3d1c;--good:#4fd09a;--bad:#ff7d75}}
:root[data-theme="dark"]{--bg:#10132a;--panel:#1a1e3d;--ink:#eceefc;--mute:#9aa1c8;--line:#2d3363;--lamp:#f2b84b;--lamp-soft:#4a3d1c;--good:#4fd09a;--bad:#ff7d75}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1,h2{font-family:"Shippori Mincho",Georgia,serif;margin:0}
h1{font-size:clamp(1.9rem,7vw,2.6rem);font-weight:800;letter-spacing:.01em}
h2{font-size:1.5rem}
.sub{color:var(--mute);margin:6px 0 24px}
.grid{display:grid;gap:10px}
.mode{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font:inherit;cursor:pointer}
.mode:hover{border-color:var(--lamp)}
.mode b{font-size:1.05rem;display:block}
.mode small{color:var(--mute)}
.best{font-size:.85rem;color:var(--mute);text-align:right;white-space:nowrap}
button:focus-visible,input:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.primary{background:var(--lamp);color:#1b1f3b;border:0;border-radius:8px;padding:11px 20px;font:inherit;font-weight:700;cursor:pointer}
input[type=text],input[type=number]{flex:1;min-width:0;font:inherit;font-size:1.25rem;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.stats{display:flex;gap:16px;flex-wrap:wrap;color:var(--mute);font-size:.95rem}
.stats b{color:var(--ink)}
.bar{position:relative;height:14px;border-radius:7px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.lit{position:absolute;top:0;bottom:0;background:var(--lamp);box-shadow:0 0 14px var(--lamp);transition:left .35s,width .35s;min-width:3px}
.msg{min-height:1.5em;margin:8px 0 0;font-weight:500}
.msg.err{color:var(--bad)}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:260px;overflow:auto}
.hist li{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;background:var(--bg)}
.tag{font-weight:700}
.t-low,.t-high{color:var(--mute)}
.t-cl{color:var(--lamp)}
.end{text-align:center;padding:28px 16px}
.end .big{font-family:"Shippori Mincho",serif;font-size:3rem;font-weight:800;margin:8px 0}
.win{color:var(--good)}.lose{color:var(--bad)}
label.chk{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:.95rem}
.hide{display:none}
.cust{display:grid;gap:8px}
.cust .row input{font-size:1rem}
@media (prefers-reduced-motion:reduce){.lit{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
var MODES=[
 {id:"se",name:"Super easy",max:10,limit:5,close:2},
 {id:"e",name:"Easy",max:100,limit:10,close:10},
 {id:"m",name:"Medium",max:1000,limit:15,close:100},
 {id:"h",name:"Hard",max:10000,limit:20,close:1000},
 {id:"x",name:"Extreme",max:100000,limit:25,close:10000},
 {id:"i",name:"Impossible",max:1000000,limit:30,close:100000}
];
var app=document.getElementById("app"),S=null,showRange=true;
function fmt(n){return n.toLocaleString("id-ID")}
function getBest(){try{return JSON.parse(localStorage.getItem("shiroakari-best")||"{}")}catch(e){return {}}}
function setBest(id,n){try{var b=getBest();if(!b[id]||n<b[id]){b[id]=n;localStorage.setItem("shiroakari-best",JSON.stringify(b));return true}}catch(e){}return false}
function el(h){app.innerHTML=h}
function lobby(){
 var b=getBest();
 var h='<h1>Binary Search ShiroAkari</h1><p class="sub">Tebak angka rahasia dengan hint too low, close below, close above, atau too high. Pilih mode.</p><div class="grid">';
 MODES.forEach(function(m){
  h+='<button class="mode" data-id="'+m.id+'"><span><b>'+m.name+'</b><small>Angka 1–'+fmt(m.max-1)+' · close ≤ '+fmt(m.close)+' · '+m.limit+' tebakan</small></span><span class="best">'+(b[m.id]?'Rekor '+b[m.id]:'Belum ada rekor')+'</span></button>';
 });
 h+='</div><div class="card cust"><b>Mode kustom</b><div class="row"><input type="number" id="cmax" min="10" max="1000000" placeholder="Batas atas (10–1000000)"><input type="number" id="clim" min="1" max="100" placeholder="Batas tebakan"></div><div class="row"><button class="primary" id="cgo">Mulai kustom</button><span class="sub" style="margin:0" id="cerr"></span></div></div>';
 el(h);
 app.querySelectorAll(".mode").forEach(function(x){x.onclick=function(){start(MODES.filter(function(m){return m.id===x.dataset.id})[0])}});
 document.getElementById("cgo").onclick=function(){
  var mx=parseInt(document.getElementById("cmax").value,10),lm=parseInt(document.getElementById("clim").value,10);
  if(!(mx>=10&&mx<=1000000)||!(lm>=1&&lm<=100)){document.getElementById("cerr").textContent="Batas atas harus 10–1.000.000 dan batas tebakan 1–100.";return}
  start({id:"c",name:"Kustom",max:mx,limit:lm,close:Math.max(1,Math.round(mx/10))});
 };
}
function start(m){
 S={m:m,secret:1+Math.floor(Math.random()*(m.max-1)),g:[],lo:1,hi:m.max-1,msg:"",err:false};
 play();
}
function hint(g){
 var n=S.secret,m=S.m;
 if(g===n)return "correct";
 var cl=Math.abs(g-n)<=m.close;
 if(g<n)return cl?"close below":"too low";
 return cl?"close above":"too high";
}
function cls(h){return h.indexOf("close")===0?"t-cl":"t-"+(h==="too low"?"low":"high")}
function play(){
 var m=S.m,left=m.limit-S.g.length,pct=function(v){return (v-1)/(m.max-2)*100};
 var h='<div class="top"><h2>'+m.name+'</h2><button class="ghost" id="back">Lobby</button></div>';
 h+='<p class="sub" style="margin-bottom:0">Tebak angka 1–'+fmt(m.max-1)+'. Close berarti selisih ≤ '+fmt(m.close)+'.</p>';
 h+='<div class="card"><div class="stats"><span>Sisa tebakan <b>'+left+'/'+m.limit+'</b></span>';
 if(showRange)h+='<span>Rentang mungkin <b>'+fmt(S.lo)+'–'+fmt(S.hi)+'</b></span>';
 h+='</div>';
 if(showRange){var l=pct(S.lo),w=Math.max(pct(S.hi)-l,0);h+='<div class="bar" aria-hidden="true"><div class="lit" style="left:'+l+'%;width:'+w+'%"></div></div>'}
 h+='<div class="row" style="margin-top:12px"><input type="text" id="gin" inputmode="numeric" autocomplete="off" placeholder="Tebakanmu" aria-label="Tebakan"><button class="primary" id="go">Tebak</button></div>';
 h+='<p class="msg'+(S.err?' err':'')+'" role="status">'+S.msg+'</p>';
 h+='<label class="chk"><input type="checkbox" id="rg"'+(showRange?' checked':'')+'> Tampilkan rentang mungkin</label></div>';
 h+='<div class="card"><b>Riwayat</b>';
 if(!S.g.length)h+='<p class="sub" style="margin:6px 0 0">Belum ada tebakan. Ketik angka lalu tekan Tebak.</p>';
 else{h+='<ul class="hist">';for(var i=S.g.length-1;i>=0;i--){var e=S.g[i];h+='<li><span>#'+(i+1)+' · '+fmt(e.v)+'</span><span class="tag '+cls(e.h)+'">'+e.h+'</span></li>'}h+='</ul>'}
 h+='</div>';
 el(h);
 var inp=document.getElementById("gin");inp.focus();
 inp.onkeydown=function(e){if(e.key==="Enter")submit()};
 document.getElementById("go").onclick=submit;
 document.getElementById("back").onclick=lobby;
 document.getElementById("rg").onchange=function(e){showRange=e.target.checked;play()};
}
function submit(){
 var raw=document.getElementById("gin").value.trim(),m=S.m;
 S.err=true;
 if(!/^\d+$/.test(raw)){S.msg="Masukkan bilangan bulat tanpa huruf atau desimal. Jatah tebakan tidak berkurang.";return play()}
 var v=parseInt(raw,10);
 if(v<1||v>m.max-1){S.msg="Angka harus antara 1 dan "+fmt(m.max-1)+". Jatah tebakan tidak berkurang.";return play()}
 if(S.g.some(function(x){return x.v===v})){S.msg="Angka "+fmt(v)+" sudah kamu tebak. Coba angka lain.";return play()}
 var h=hint(v);S.g.push({v:v,h:h});S.err=false;
 if(h==="correct")return end(true);
 if(h==="too low"||h==="close below"){S.lo=Math.max(S.lo,v+1);if(h==="close below")S.hi=Math.min(S.hi,v+m.close)}
 else{S.hi=Math.min(S.hi,v-1);if(h==="close above")S.lo=Math.max(S.lo,v-m.close)}
 if(S.g.length>=m.limit)return end(false);
 S.msg=fmt(v)+": "+h+".";
 play();
}
function end(win){
 var m=S.m,n=S.g.length,opt=Math.ceil(Math.log2(m.max-1)),h;
 if(win){
  var rec=m.id!=="c"&&setBest(m.id,n);
  h='<div class="card end"><div class="win">Benar</div><div class="big">'+fmt(S.secret)+'</div><p>Ketemu di tebakan ke-'+n+' dari '+m.limit+' pada mode '+m.name+'.</p><p class="sub">Binary search biasa butuh paling banyak '+opt+' tebakan di rentang ini.'+(rec?' Ini rekor terbaikmu untuk mode ini.':'')+'</p>';
 }else{
  h='<div class="card end"><div class="lose">Kalah, '+m.limit+' tebakan habis</div><div class="big">'+fmt(S.secret)+'</div><p>Itu angka rahasianya di mode '+m.name+'.</p><p class="sub">Tebak titik tengah rentang yang tersisa, dan perkecil rentang tiap kali dapat hint close.</p>';
 }
 h+='<div class="row" style="justify-content:center"><button class="primary" id="again">Main lagi</button><button class="ghost" id="lob">Kembali ke lobby</button></div></div>';
 h+='<div class="card"><b>Riwayat</b><ul class="hist" style="margin-top:8px">';
 S.g.forEach(function(e,i){h+='<li><span>#'+(i+1)+' · '+fmt(e.v)+'</span><span class="tag '+(e.h==="correct"?"win":cls(e.h))+'">'+e.h+'</span></li>'});
 h+='</ul></div>';
 el(h);
 document.getElementById("again").onclick=function(){start(m)};
 document.getElementById("lob").onclick=lobby;
}
lobby();
</script>
</body>
</html>
